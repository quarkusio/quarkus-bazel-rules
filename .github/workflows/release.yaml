# Cut a release whenever a new tag is pushed to the repo.
name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  release:
    uses: ./.github/workflows/bazel-contrib_release_ruleset_adapted.yaml
    with:
      # The quarkifier jars are built by release_prep.sh in the same run that
      # assembles the source archive, so the archive's QUARKIFIER_SHA256 map
      # (patched by release_prep.sh) always matches the released jars.
      release_files: |
        rules_quarkus-*.tar.gz
        quarkifier-*.jar
      prerelease: false
      tag_name: ${{ github.ref_name }}
  publish:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ github.ref_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
